<main id="MainContent" class="container mt-4 mb-6 page-container">
  <!-- ═══ PROTOTYPE CONTENT START: replace everything inside <main> ═══ -->
  <div class="page-header-container d-flex justify-content-between align-items-start gap-3">
    <div class="flex-grow-1">
      <h1>Spring Grants 2026 Application</h1>
      <p class="mb-0">Due April 15, 2026 at 5:00 PM</p>
    </div>
  </div>

  <form class="mt-3" style="max-width: 640px" novalidate>
    <div class="mb-3">
      <label for="ProjectTitle" class="form-label">Project title</label>
      <input type="text" id="ProjectTitle" class="form-control" value="Community Garden Expansion" />
    </div>
    <div class="mb-3">
      <label for="AmountRequested" class="form-label">Amount requested</label>
      <div class="input-group">
        <span class="input-group-text">$</span>
        <input type="text" id="AmountRequested" class="form-control" inputmode="decimal" value="30,000.00" />
      </div>
      <div class="form-text">Up to $50,000.</div>
    </div>
    <div class="mb-3">
      <label for="ProjectSummary" class="form-label">Project summary</label>
      <textarea id="ProjectSummary" class="form-control" rows="4">Expand the community garden from 12 to 30 plots and add an accessible raised-bed section.</textarea>
    </div>
    <fieldset class="mb-4">
      <legend class="form-label">Have you received funding from us before?</legend>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="PriorFunding" id="PriorFundingYes" />
        <label class="form-check-label" for="PriorFundingYes">Yes</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="PriorFunding" id="PriorFundingNo" checked />
        <label class="form-check-label" for="PriorFundingNo">No</label>
      </div>
    </fieldset>
    <div class="d-flex justify-content-between">
      <button type="button" class="btn btn-outline-secondary">Save Draft</button>
      <button type="button" class="btn btn-primary">Submit</button>
    </div>
  </form>
  <!-- ═══ PROTOTYPE CONTENT END ═══ -->

<script>
  // Production's header offset (Foundant/Views/Shared/Mdb/_TopLayoutBase.cshtml)
  (function () {
    'use strict';
    function adjustMainPadding() {
      const header = document.getElementById('MainHeader');
      const main = document.getElementById('MainContent');
      if (header && main) {
        if (main.classList.contains('page-container')) {
          main.classList.remove('mt-4');
          main.style.marginTop = (header.offsetHeight + 15) + 'px';
        } else {
          main.style.paddingTop = header.offsetHeight + 'px';
        }
      }
    }
    const header = document.getElementById('MainHeader');
    if (header && 'ResizeObserver' in window) {
      new ResizeObserver(adjustMainPadding).observe(header);
    }
    window.addEventListener('load', adjustMainPadding);
    window.addEventListener('resize', adjustMainPadding);
    adjustMainPadding();
  })();
</script>
